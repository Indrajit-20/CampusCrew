<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%" fill="none">
  <!-- Background Soft Warm Blob -->
  <rect x="20" y="20" width="500" height="340" rx="24" fill="#FEFFDE" opacity="0.85" />
  <circle cx="440" cy="90" r="60" fill="#DDFFBC" opacity="0.6" />
  <circle cx="80" cy="300" r="45" fill="#91C788" opacity="0.25" />

  <!-- College & Project Notice Board / Canvas -->
  <g transform="translate(140, 45)">
    <!-- Main Board -->
    <rect x="0" y="0" width="260" height="175" rx="14" fill="#FFFFFF" stroke="#91C788" stroke-width="2" />
    
    <!-- Board Header -->
    <rect x="0" y="0" width="260" height="36" rx="14" fill="#52734D" />
    <rect x="0" y="22" width="260" height="14" fill="#52734D" />
    <circle cx="20" cy="18" r="4" fill="#DDFFBC" />
    <circle cx="34" cy="18" r="4" fill="#DDFFBC" />
    <circle cx="48" cy="18" r="4" fill="#DDFFBC" />
    <text x="70" y="22" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">CAMPUS PROJECT BOARD</text>
    
    <!-- Pinned Card 1: Hackathon Team -->
    <g transform="translate(16, 50)">
      <rect x="0" y="0" width="108" height="105" rx="8" fill="#FAFBF7" stroke="#E0E8DC" stroke-width="1.5" />
      <rect x="8" y="10" width="40" height="12" rx="4" fill="#DDFFBC" />
      <text x="14" y="19" fill="#2D4826" font-family="-apple-system, sans-serif" font-size="8" font-weight="700">DEV TEAM</text>
      <rect x="8" y="28" width="85" height="6" rx="3" fill="#52734D" />
      <rect x="8" y="38" width="60" height="5" rx="2.5" fill="#91C788" opacity="0.7" />
      
      <!-- Progress Bar -->
      <rect x="8" y="55" width="92" height="6" rx="3" fill="#E8F0E5" />
      <rect x="8" y="55" width="62" height="6" rx="3" fill="#52734D" />
      
      <circle cx="18" cy="85" r="9" fill="#52734D" />
      <text x="15" y="88" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">A</text>
      <circle cx="32" cy="85" r="9" fill="#91C788" />
      <text x="29" y="88" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">K</text>
      <circle cx="46" cy="85" r="9" fill="#DDFFBC" stroke="#52734D" stroke-width="1" />
      <text x="43" y="88" fill="#52734D" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">+</text>
    </g>

    <!-- Pinned Card 2: Campus Design Fest -->
    <g transform="translate(136, 50)">
      <rect x="0" y="0" width="108" height="105" rx="8" fill="#FAFBF7" stroke="#E0E8DC" stroke-width="1.5" />
      <rect x="8" y="10" width="46" height="12" rx="4" fill="#FEFFDE" stroke="#91C788" stroke-width="1" />
      <text x="12" y="19" fill="#52734D" font-family="-apple-system, sans-serif" font-size="8" font-weight="700">DESIGN GIG</text>
      <rect x="8" y="28" width="90" height="6" rx="3" fill="#52734D" />
      <rect x="8" y="38" width="70" height="5" rx="2.5" fill="#91C788" opacity="0.7" />
      
      <!-- Skill tags mini -->
      <rect x="8" y="52" width="42" height="11" rx="3" fill="#EBF3E8" />
      <text x="12" y="60" fill="#52734D" font-family="-apple-system, sans-serif" font-size="7">Figma</text>
      <rect x="54" y="52" width="38" height="11" rx="3" fill="#EBF3E8" />
      <text x="58" y="60" fill="#52734D" font-family="-apple-system, sans-serif" font-size="7">UI/UX</text>
      
      <!-- Spots Left Pill -->
      <rect x="8" y="78" width="92" height="16" rx="4" fill="#52734D" />
      <text x="24" y="89" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="8" font-weight="600">2 Spots Open</text>
    </g>
  </g>

  <!-- Desk Surface -->
  <rect x="60" y="275" width="420" height="10" rx="5" fill="#52734D" />
  <rect x="85" y="285" width="12" height="55" rx="3" fill="#7A9A74" />
  <rect x="443" y="285" width="12" height="55" rx="3" fill="#7A9A74" />

  <!-- Person Left (Student Developer) -->
  <g transform="translate(65, 175)">
    <!-- Body -->
    <path d="M 20 85 C 20 62, 70 62, 70 85 Z" fill="#52734D" />
    <!-- Head -->
    <circle cx="45" cy="42" r="19" fill="#F7D3B6" />
    <!-- Hair -->
    <path d="M 28 42 C 28 24, 62 24, 62 42 C 55 35, 35 35, 28 42 Z" fill="#2E3B2C" />
    <!-- Laptop -->
    <path d="M 45 80 L 85 80 L 80 100 L 40 100 Z" fill="#91C788" />
    <rect x="55" y="58" width="35" height="23" rx="3" fill="#FFFFFF" stroke="#52734D" stroke-width="1.5" />
    <path d="M 68 67 L 77 67" stroke="#52734D" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Person Right (Student Designer / Creator) -->
  <g transform="translate(385, 175)">
    <!-- Body -->
    <path d="M 20 85 C 20 62, 70 62, 70 85 Z" fill="#91C788" />
    <!-- Head -->
    <circle cx="45" cy="42" r="19" fill="#F0C3A2" />
    <!-- Hair -->
    <path d="M 26 40 C 26 20, 64 20, 64 45 C 50 48, 40 48, 26 40 Z" fill="#4B382A" />
    <!-- Notebook & Pen -->
    <rect x="5" y="75" width="30" height="24" rx="2" fill="#FEFFDE" stroke="#52734D" stroke-width="1.2" transform="rotate(-8 5 75)" />
    <line x1="8" y1="83" x2="28" y2="80" stroke="#52734D" stroke-width="1.5" />
    <line x1="9" y1="90" x2="25" y2="88" stroke="#52734D" stroke-width="1.5" />
  </g>

  <!-- Coffee Mug & Plant on Desk -->
  <g transform="translate(245, 240)">
    <!-- Coffee Mug -->
    <rect x="0" y="15" width="16" height="20" rx="3" fill="#FEFFDE" stroke="#52734D" stroke-width="1.5" />
    <path d="M 16 20 C 21 20, 21 28, 16 28" stroke="#52734D" stroke-width="1.5" fill="none" />
    <!-- Steam -->
    <path d="M 4 8 C 4 3, 8 3, 8 -2" stroke="#91C788" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <path d="M 10 10 C 10 5, 14 5, 14 0" stroke="#91C788" stroke-width="1.2" stroke-linecap="round" fill="none" />
    
    <!-- Mini Potted Plant -->
    <g transform="translate(35, 10)">
      <polygon points="4,25 18,25 16,13 6,13" fill="#52734D" />
      <circle cx="11" cy="9" r="6" fill="#91C788" />
      <circle cx="7" cy="6" r="4" fill="#DDFFBC" />
      <circle cx="15" cy="6" r="4" fill="#DDFFBC" />
    </g>
  </g>
</svg>

